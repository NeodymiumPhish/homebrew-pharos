name: Update Cask

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (without v prefix)'
        required: true

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HOMEBREW_PAT }}

      - name: Update cask formula
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi

          echo "Updating to version $VERSION"

          DMG_URL="https://github.com/NeodymiumPhish/Pharos/releases/download/v${VERSION}/Pharos-v${VERSION}.dmg"
          curl -L -o pharos.dmg "$DMG_URL"
          SHA256=$(shasum -a 256 pharos.dmg | cut -d ' ' -f 1)
          rm pharos.dmg

          echo "SHA256: $SHA256"

          cat > Casks/pharos.rb << FORMULA
          cask "pharos" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/NeodymiumPhish/Pharos/releases/download/v#{version}/Pharos-v#{version}.dmg"
            name "Pharos"
            desc "High-performance PostgreSQL client"
            homepage "https://github.com/NeodymiumPhish/Pharos"

            depends_on :macos

            app "Pharos.app"

            postflight_steps do
              run "/usr/bin/xattr", args: ["-c", "-r", "{{appdir}}/Pharos.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.pharos.client",
              "~/Library/Caches/com.pharos.client",
            ]

            caveats <<~EOS
              This app is not signed with a Developer ID.
              If macOS blocks it, run:
                xattr -d com.apple.quarantine /Applications/Pharos.app
            EOS
          end
          FORMULA

      - name: Commit and push
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pharos.rb
          git commit -m "Update pharos to $VERSION" || exit 0
          git push
